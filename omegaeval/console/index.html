<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OmegaEval Console</title>
<meta name="description" content="Benchmark console for OmegaClaw agents and hives">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#f3f4f6;--surface:#ffffff;--surface-2:#f7f8fa;--ink:#15181c;--ink-2:#4f565f;--muted:#80878f;
  --line:#e2e5ea;--line-2:#cdd2d9;--hatch:#d9dde3;
  --better:#2a78d6;--better-bg:#e6effb;--worse:#e34948;--worse-bg:#fbe6e6;--neutral:#9aa0a8;
  --accent:#0e7c86;--accent-bg:#e3f1f2;
  --llm:#1baf7a;--pln:#eb6834;--mem:#4a3aa7;--warn:#c98500;--crit:#d03b3b;--good:#0ca30c;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1012;--surface:#161a1e;--surface-2:#1c2126;--ink:#eef0f3;--ink-2:#aab1ba;--muted:#7b838d;
    --line:#2a3037;--line-2:#3a424b;--hatch:#2c333a;
    --better:#3987e5;--better-bg:#17304f;--worse:#e66767;--worse-bg:#4a2426;--neutral:#6f767f;
    --accent:#3aa7b1;--accent-bg:#173437;
    --llm:#199e70;--pln:#d95926;--mem:#9085e9;--warn:#c98500;--crit:#e66767;--good:#0ca30c;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1012;--surface:#161a1e;--surface-2:#1c2126;--ink:#eef0f3;--ink-2:#aab1ba;--muted:#7b838d;
  --line:#2a3037;--line-2:#3a424b;--hatch:#2c333a;
  --better:#3987e5;--better-bg:#17304f;--worse:#e66767;--worse-bg:#4a2426;--neutral:#6f767f;
  --accent:#3aa7b1;--accent-bg:#173437;
  --llm:#199e70;--pln:#d95926;--mem:#9085e9;--warn:#c98500;--crit:#e66767;--good:#0ca30c;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
table{font:inherit;border-collapse:collapse}
h1{font-size:18px;font-weight:600;margin:0;text-wrap:balance}
h2{font-size:13.5px;font-weight:600;margin:0}
h3{font-size:11px;font-weight:500;margin:0 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sub{color:var(--muted);font-size:12.5px}
.mono{font-family:var(--mono);font-size:12px}
.num{font-variant-numeric:tabular-nums}
.na{color:var(--muted)}
.why{border-bottom:1px dotted var(--muted);cursor:help}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-block:9px;padding-inline:16px;display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
.brand{font-weight:600;font-size:15px;display:flex;align-items:center;gap:10px}
.brand .mark{width:18px;height:18px;border-radius:4px;background:var(--ink);position:relative;flex:none}
.brand .mark::after{content:"";position:absolute;inset:4px;border-radius:2px;border:2px solid var(--surface);border-right-color:transparent}
.src{font-weight:400;font-size:11.5px;border:1px solid var(--line-2);border-radius:999px;padding:1px 8px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center;max-width:320px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.src i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.src.live i{background:var(--good)}
.ctx{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto}
.field{display:flex;gap:6px;align-items:center;border:1px solid var(--line-2);background:var(--surface-2);border-radius:6px;padding:3px 8px;max-width:100%}
.field span{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.field select{border:0;background:transparent;font-family:var(--mono);font-size:12px;max-width:52vw;padding:2px 0}
.field select:focus-visible,.field input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.field input{border:0;background:transparent;font-family:var(--mono);font-size:12px;width:15ch;padding:2px 0;color:var(--ink)}
.links{display:inline-flex;gap:10px;font-weight:400;font-size:12px}
.links a{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--line-2)}
.links a:hover{color:var(--ink);border-bottom-color:var(--ink-2)}
.body{display:grid;grid-template-columns:160px minmax(0,1fr)}
.rail{border-right:1px solid var(--line);background:var(--surface);padding-block:14px;padding-inline:8px;display:flex;flex-direction:column;gap:2px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px)}
.rail button{all:unset;cursor:pointer;padding:8px 12px;border-radius:6px;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center;font:inherit}
.rail button small{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.rail button:hover{background:var(--surface-2)}
.rail button[aria-selected="true"]{background:var(--surface-2);color:var(--ink);font-weight:500;box-shadow:inset 3px 0 0 var(--accent)}
.rail button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
main{padding-block:18px 48px;padding-inline:20px;min-width:0}
.view{max-width:1280px;margin:0 auto;display:grid;gap:14px}
.vh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding-block:12px;padding-inline:14px;min-width:0}
.card>h2{margin-bottom:2px}
.card>.sub{margin-bottom:10px}
.scroll{overflow-x:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;border-radius:999px;padding:2px 9px;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.pill.ok i{background:var(--good)}.pill.bad i{background:var(--crit)}.pill.warn i{background:var(--warn)}
.pill.na{border-style:dashed;color:var(--muted)}
.empty{border:1px dashed var(--line-2);border-radius:8px;padding:16px;color:var(--ink-2);background:var(--surface);line-height:1.6}
.empty b{color:var(--ink)}
.empty code,.code{font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
pre.cmd{font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;overflow-x:auto;margin:6px 0;white-space:pre}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* play */
.playgrid{display:grid;grid-template-columns:290px minmax(0,1fr);gap:14px;align-items:start}
.world .grid{display:inline-grid;gap:2px;background:var(--surface-2);padding:6px;border-radius:6px;border:1px solid var(--line)}
.world .c{border-radius:3px;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:500}
.world .c.q{border:1px dashed var(--line-2)}
.world .c.w{background:var(--ink-2)}
.world .c.s{background:var(--surface)}
.world .c.v{background:var(--better-bg)}
.world .c.k{color:var(--warn);background:var(--surface)}
.world .c.e{color:var(--crit);background:var(--surface)}
.world .c.a{background:var(--accent);color:#fff}
.wstats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.wstats div{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--surface-2)}
.wstats small{display:block;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}
.wstats b{font-family:var(--mono);font-weight:500;font-size:13px}
.strip-card[data-active="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.striphead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.striphead .who{font-weight:600}
.striphead .who .mono{color:var(--muted);font-weight:400;margin-left:6px}
.striphead .pills{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
svg.strip{display:block;cursor:crosshair}
svg.strip .lab{fill:var(--ink);font-size:11.5px}
svg.strip .lab.off{fill:var(--muted)}
svg.strip .lab2{fill:var(--muted);font-size:10px;font-family:var(--mono)}
svg.strip .tick{fill:var(--muted);font-size:10px;font-family:var(--mono)}
svg.strip .bg{fill:var(--surface)}svg.strip .bg.alt{fill:var(--surface-2)}
svg.strip .off-bg{fill:url(#hatch)}
svg.strip .evl{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:3 3}
svg.strip .evt{fill:var(--ink-2);font-size:10px;font-weight:500}
svg.strip .sel{fill:var(--accent);opacity:.14;pointer-events:none}
svg.strip .selline{stroke:var(--accent);stroke-width:1.2;pointer-events:none}
svg.strip [data-tip]{cursor:pointer}
.scrub{display:flex;align-items:center;gap:10px;margin-top:6px}
.scrub input{flex:1;accent-color:var(--accent)}
.scrub .t{font-family:var(--mono);font-size:12px;min-width:120px;text-align:right}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:11.5px;margin-top:8px;align-items:center}
.legend svg{vertical-align:middle;margin-right:4px}
.tcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.tc{border:1px solid var(--line);border-radius:6px;padding:9px 11px;background:var(--surface-2);min-width:0;font-size:12.5px}
.tc.off{background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,var(--surface) 6px 12px);color:var(--muted)}
.tc .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px}
.tc .kv>span:nth-child(odd){color:var(--muted)}
.tc pre{font-family:var(--mono);font-size:11.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word;margin:6px 0 0;padding:6px 8px;background:var(--surface);border:1px solid var(--line);border-radius:4px;max-height:220px;overflow:auto}
.tc .call{border-top:1px solid var(--line);padding-top:6px;margin-top:6px}
.tc .call:first-of-type{border-top:0;padding-top:0;margin-top:0}
.badge{display:inline-block;font-family:var(--mono);font-size:10.5px;border-radius:3px;padding:0 5px;border:1px solid var(--line-2);color:var(--ink-2);margin-right:4px}
.badge.memory{border-color:var(--mem);color:var(--mem)}.badge.reasoning{border-color:var(--pln);color:var(--pln)}
.badge.action{border-color:var(--accent);color:var(--accent)}.badge.error{border-color:var(--crit);color:var(--crit)}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:3px 8px;align-items:center;font-size:11.5px}
.bars i{display:block;height:6px;border-radius:3px;background:var(--line-2)}
/* compare */
table.t{width:100%}
table.t th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.v{font-family:var(--mono);font-size:12.5px;white-space:nowrap}
table.t tr.off td{color:var(--muted)}
table.t tbody tr.click{cursor:pointer}
table.t tbody tr.click:hover td{background:var(--surface-2)}
.seeds{display:flex;gap:2px}
.seeds i{width:11px;height:14px;border-radius:2px;display:inline-block;background:var(--line-2)}
.seeds i.better{background:var(--better)}.seeds i.worse{background:var(--worse)}.seeds i.same{background:var(--neutral)}
.seeds i.none{background:transparent;border:1px dashed var(--line-2)}
.reads.better{color:var(--better)}.reads.worse{color:var(--worse)}
.pickers{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pickers .field select{max-width:40vw}
svg.band{display:block;width:100%;height:auto;overflow:visible}
svg.band .track{stroke:var(--line-2);stroke-width:6;stroke-linecap:round}
svg.band .bl{fill:var(--ink-2);font-size:11px}
svg.band .bv{fill:var(--muted);font-size:10.5px;font-family:var(--mono)}
svg.band .gl{stroke:var(--line);stroke-width:1}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
.form label{display:grid;gap:4px;font-size:12px;color:var(--ink-2)}
.form input,.form select{border:1px solid var(--line-2);border-radius:6px;padding:6px 8px;background:var(--surface);min-width:0}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--muted);margin-right:6px;vertical-align:1px}
.dot.on{background:var(--good)}
.drop{position:fixed;inset:0;background:color-mix(in srgb,var(--accent) 18%,transparent);border:3px dashed var(--accent);display:grid;place-items:center;font-size:18px;font-weight:600;z-index:30;pointer-events:none}
.tip{position:fixed;z-index:40;background:var(--ink);color:var(--surface);font-size:12px;line-height:1.45;padding:7px 10px;border-radius:6px;pointer-events:none;max-width:380px;box-shadow:0 4px 14px rgba(0,0,0,.18);white-space:pre-line}
.world canvas{display:block;image-rendering:pixelated;border:1px solid var(--line);border-radius:4px;max-width:100%}
.world .tiles{display:inline-grid;gap:1px;background:var(--line);padding:1px;border-radius:4px;max-width:100%}
.world .tiles div{display:grid;place-items:center;font-family:var(--mono);font-size:9.5px;font-weight:600;color:#fff;text-shadow:0 0 2px #000}
.qcard{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surface-2);display:grid;gap:8px}
.qcard .q{font-size:14px;line-height:1.5;white-space:pre-wrap}
.qcard ol{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.qcard li{border:1px solid var(--line);border-radius:5px;padding:4px 8px;background:var(--surface);font-size:13px}
.qcard li.picked{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.qcard li.gold{border-color:var(--good);box-shadow:0 0 0 1px var(--good)}
.qcard .ans{font-family:var(--mono);font-size:12.5px;white-space:pre-wrap}
.tl{display:grid;gap:3px;max-height:420px;overflow:auto}
.tl .it{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;padding:4px 6px;border-radius:5px;font-size:12.5px}
.tl .it>i{width:10px;height:10px;border-radius:2px;border:1.5px solid var(--line-2);display:inline-block}
.tl .it.done>i{background:var(--better);border-color:var(--better)}
.tl .it.cur{background:var(--accent-bg)}
.tl .it.ev{box-shadow:inset 3px 0 0 var(--good)}
.tl .it .mem{font-family:var(--mono);font-size:11px;color:var(--mem);white-space:nowrap}
.tscript{max-height:420px;overflow:auto;display:grid;gap:6px}
.tscript .m{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface-2);font-size:12px}
.tscript .m.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tscript .m.reply{background:var(--surface);margin-left:18px}
.tscript .m pre{margin:4px 0 0;white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:11.5px}
.pill.void{border-color:var(--crit);color:var(--crit)}.pill.void i{background:var(--crit)}
.pill.judge{border-style:dashed}.pill.judge i{background:var(--warn)}
@media (max-width:1000px){.playgrid{grid-template-columns:1fr}}
@media (max-width:900px){
  .body{grid-template-columns:1fr}
  .rail{position:static;flex-direction:row;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;padding-block:6px;padding-inline:12px}
  .rail button[aria-selected="true"]{box-shadow:inset 0 -2px 0 var(--accent)}
  main{padding-inline:16px}
  .ctx{margin-left:0}
}
</style>

<header class="top">
  <div class="brand"><span class="mark" aria-hidden="true"></span>OmegaEval Console <span class="src" id="srcchip"><i></i><span>no data</span></span><span class="links" id="links"></span></div>
  <div class="ctx">
    <label class="field"><span>Benchmark</span><select id="benchsel" aria-label="Benchmark"></select></label>
    <label class="field"><span>Find</span><input id="runq" type="search" placeholder="agent, variant, seed" aria-label="Find runs by agent, variant, seed or run id"></label>
    <label class="field"><span>Run</span><select id="runsel" aria-label="Run"></select></label>
    <label class="field"><span>Same seed</span><select id="stacksel" aria-label="Another run of the same benchmark, task and seed, shown underneath"></select></label>
  </div>
</header>

<div class="body">
  <nav class="rail" aria-label="Views">
    <button data-view="play" aria-selected="true">Play</button>
    <button data-view="compare">Compare</button>
    <button data-view="progress">Progress</button>
    <button data-view="runs">Runs <small id="nruns"></small></button>
    <button data-view="sources">Sources</button>
  </nav>
  <main>
    <section class="view" id="view-play"></section>
    <section class="view" id="view-compare" hidden></section>
    <section class="view" id="view-progress" hidden></section>
    <section class="view" id="view-runs" hidden></section>
    <section class="view" id="view-sources" hidden></section>
  </main>
</div>
<div class="drop" id="drop" hidden>Drop run bundles or exports</div>
<div class="tip" id="tip" hidden></div>
<script type="application/json" id="embedded-runs">{"schema":"omegaeval.export/0","runs":[]}</script>

<script>
"use strict";
/* ============================== basics ============================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmt=(v,d=0)=>v==null||Number.isNaN(v)?'—':(typeof v==='number'?v.toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:d}):String(v));
const sgn=(v,d=0)=>v==null?'—':(v>0?'+':v<0?'−':'')+fmt(Math.abs(v),d);
const median=a=>{const b=a.filter(x=>x!=null).sort((x,y)=>x-y);if(!b.length)return null;const m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2};
const sum=a=>a.reduce((s,x)=>s+(x||0),0);
const keyOf=b=>`${b.run_id}/${b.attempt}`;
const tip=$('#tip');
document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-tip]');if(!el)return;tip.textContent=el.dataset.tip;tip.hidden=false;place(e)});
document.addEventListener('mousemove',e=>{if(!tip.hidden)place(e)});
document.addEventListener('mouseout',e=>{if(e.target.closest('[data-tip]'))tip.hidden=true});
function place(e){const r=tip.getBoundingClientRect();let L=e.clientX+12,T=e.clientY+14;if(L+r.width>innerWidth-8)L=e.clientX-r.width-12;if(T+r.height>innerHeight-8)T=e.clientY-r.height-12;tip.style.left=Math.max(4,L)+'px';tip.style.top=Math.max(4,T)+'px'}
const store={get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ============================== the field registry ==============================
   Every element the console shows names its source here. status(b) says whether
   the selected run carries it. "omega" fields exist in OmegaClaw but need an Omega
   log in the run; "absent" fields do not exist in OmegaClaw at all. */
const hasOmega=b=>Object.values(b?.agents||{}).some(a=>(a.iterations||[]).length>0);
const hasEnv=b=>(b?.env||[]).some(e=>e.kind==='observation');
const hasPred=b=>(b?.env||[]).some(e=>e.kind==='action'&&e.prediction!=null);
const anyIter=(b,f)=>Object.values(b?.agents||{}).some(a=>(a.iterations||[]).some(f));
const NO_OMEGA='This run has no trace for this agent. For OmegaClaw, configure logs = { docker = "<container>" } or { file = "<path>" } in omegaeval.toml. Any other agent can report trace events with its replies.';
const NO_ENV='This run has no environment events. It is an imported log, not a benchmark episode.';
const FIELDS=[
 {id:'obs',group:'Play',label:'Observation',source:'Environment adapter, delivered by the gateway (env.jsonl, kind observation). The OmegaClaw log line (HUMAN-MSG: …) shows the loop turn that read it.',need:'env'},

const F=Object.fromEntries(FIELDS.map(f=>[f.id,f]));
function status(id,b,ctx={}){
  const f=F[id];if(!f)return {ok:false,reason:'unknown field'};
  if(f.absent)return {ok:false,absent:true,reason:f.absent};
  if(f.need==='variants')return (ctx.variants||0)>1?{ok:true}:{ok:false,reason:'Only one variant of this agent has been run on this benchmark. Queue the same agent again with a --variant label, for example reasoningMode=low.'};
  if(f.need==='derived-pred')return hasPred(b)?{ok:true,derived:true}:{ok:false,absent:true,reason:f.absentWhenOff};
  if(!b)return {ok:false,reason:'No run selected.'};
  switch(f.need){
    case 'env':return hasEnv(b)?{ok:true}:{ok:false,reason:NO_ENV};
    case 'omega':return hasOmega(b)?{ok:true}:{ok:false,reason:NO_OMEGA};
    case 'raw':return !hasOmega(b)?{ok:false,reason:NO_OMEGA}:anyIter(b,it=>(it.llm||[]).some(u=>u.raw!=null))?{ok:true}:{ok:false,reason:'No [LLM_RAW] lines in this run. The agent logged at INFO. Start it with a DEBUG logging config for lib_llm_ext to capture raw completions.'};
    case 'pred':return hasPred(b)?{ok:true}:{ok:false,reason:f.absentWhenOff};
    case 'render':return (b.env||[]).some(e=>e.kind==='render')?{ok:true}:{ok:false,reason:hasEnv(b)?'This environment adapter has no renderer.':NO_ENV};
    case 'ceiling':return b.result?.regret?.available===false?{ok:false,reason:b.result.regret.reason}:hasEnv(b)?{ok:true}:{ok:false,reason:NO_ENV};
    case 'cost':{const c=b.result?.cost;return c&&c.available!==false?{ok:true}:{ok:false,reason:c?.reason||'No result yet.'}}
    case 'version':{const v=b.manifest?.provenance?.agent_versions||{};return Object.values(v).some(Boolean)?{ok:true}:{ok:false,reason:'No "Omega version=" message reached the gateway in this run. Baseline agents do not send one.'}}
    case 'memfp':{const m=b.manifest?.provenance?.memory_start||{};const on=Object.values(m).some(x=>x&&x.available);return on?{ok:true}:{ok:false,reason:(Object.values(m)[0]||{}).reason||'No memory location configured.'}}
    case 'local':return LOCAL?{ok:true}:{ok:false,reason:'Needs the local harness (omegaeval serve). Exported bundles keep only an excerpt of each prompt.'};
    case 'variants':return (ctx.variants||0)>1?{ok:true}:{ok:false,reason:'Only one variant of this agent has been run on this benchmark. Queue the same agent with --variant, for example reasoningMode=low.'};
    case 'agenttrace':return (b.env||[]).some(e=>e.kind==='agent_trace'&&e.trace?.kind==='concepts')?{ok:true}:{ok:false,reason:Object.values(b.manifest?.members||{}).some(x=>x.kind==='omega')?F.atomspace.absent:'No agent reported concepts in this run.'};
    case 'toolpolicy':{const tp=b.manifest?.environment?.tool_policy||{};return (tp.forbid||[]).length||(tp.allow||[]).length?{ok:true}:{ok:false,reason:'This benchmark sets no tool rules.'}}
    case 'evidence':return Object.values(b.manifest?.members||{}).some(x=>x.evidence)?{ok:true}:{ok:false,reason:'Recorded from version 0.2 of the harness.'};
  }
  return {ok:true};
}

let LOCAL=false,STATE=null,LAST_SIG='';
const RUNS=new Map();       // key -> bundle (full) or stub {stub:true,...}
let RESULTS=[];             // [{run_id,attempt,identity,result,...}] for compare/progress
let SEL=null,STACK='',TICK=0,ACTIVE_MEMBER=null,BENCH=store.get('oe5.bench',''),FORBID={forbid:new Set(),allow:null},OPENED=null;
function ruleBroken(skill){return FORBID.forbid.has(skill)||(FORBID.allow!=null&&!FORBID.allow.has(skill))}
function benchmarks(){
  const m=new Map();
  if(LOCAL&&STATE){
    for(const [k,d] of Object.entries(STATE.environments||{}))m.set(k,{id:k,desc:d,label:d.label||k,name:d.name||'',runs:STATE.run_counts?.[k]?.runs||0});
    for(const [k,c] of Object.entries(STATE.run_counts||{}))if(!m.has(k))m.set(k,{id:k,desc:{},label:k,name:'no longer installed',runs:c.runs});
    for(const b of RUNS.values())if(b._origin==='file'){const id=b.manifest?.identity?.env;if(id&&!m.has(id))m.set(id,{id,desc:b.manifest?.environment||{},label:b.manifest?.benchmark?.label||id,name:b.manifest?.benchmark?.name||'',runs:0})}
  }else for(const b of RUNS.values()){const id=b.manifest?.identity?.env;if(!id)continue;const bm=b.manifest?.benchmark||{},d=b.manifest?.environment||{};
    if(!m.has(id))m.set(id,{id,desc:d,label:bm.label||d.label||id,name:bm.name||d.name||'',runs:0});m.get(id).runs++}
  return [...m.values()].sort((a,b)=>a.label.localeCompare(b.label));
}
const inBench=b=>!BENCH||b.manifest?.identity?.env===BENCH;
function addBundle(b,origin){
  if(!b||!b.manifest)return;
  if(b.kind==='log-import'){b.run_id=b.run_id==='import'?('import-'+(RUNS.size+1)):b.run_id}
  b._origin=origin;RUNS.set(keyOf(b),b);
}
function resultsFromBundles(){
  return [...RUNS.values()].filter(b=>!b.stub&&b.result&&b.manifest?.identity?.env).map(b=>({run_id:b.run_id,attempt:b.attempt,identity:b.manifest.identity,started_at:b.manifest.started_at,status:b.manifest.status,agent_versions:b.manifest.provenance?.agent_versions,models_seen:b.manifest.provenance?.models_seen,result:b.result}));
}
function ingest(obj,origin){
  if(obj?.schema==='omegaeval.export/0')(obj.runs||[]).forEach(b=>addBundle(b,origin));
  else if(Array.isArray(obj))obj.forEach(b=>addBundle(b,origin));
  else addBundle(obj,origin);
}
async function api(path,opts){const r=await fetch(path,opts);if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||r.statusText);return r.json()}
async function detectLocal(){
  if(EMBED_META?.harness){LOCAL=false;return}   /* an exported page is a snapshot: no harness to ask */
  try{STATE=await api('/api/state');LOCAL=true}catch(e){LOCAL=false}
  if(LOCAL){await refreshLocal(true);setInterval(()=>refreshLocal(false),2500)}
}
/* The harness sends one benchmark's runs at a time, newest first and at most PAGE of them, and
   the console asks again only when the ledger grows or the selection changes. */
const PAGE=500;const FULL=new Map();let LOADED_KEY='',RUN_TOTAL=0,RUNQ='',PROGRESS=[];
const rowSig=r=>JSON.stringify([r.status,r.terminal,r.success,r.needs_judge,r.judged,r.void]);
function stubOf(r){return {stub:true,run_id:r.run_id,attempt:r.attempt,row:r,manifest:{status:r.status,started_at:r.started_at,identity:{env:r.env,task:r.task,seed:r.seed,subject:r.subject,label:r.label,variant:r.variant}}}}
async function refreshLocal(force){
  try{
    STATE=await api('/api/state');
    const key=JSON.stringify([STATE.ledger_rev,BENCH,RUNQ]);
    if(force||key!==LOADED_KEY){
      const qs=new URLSearchParams({limit:String(PAGE)});if(BENCH)qs.set('env',BENCH);if(RUNQ)qs.set('q',RUNQ);
      const page=await api('/api/runs?'+qs);RUN_TOTAL=page.total;
      const next=new Map();for(const [k,b] of RUNS)if(b._origin==='file')next.set(k,b);
      for(const r of page.rows){const k=`${r.run_id}/${r.attempt}`;const f=FULL.get(k);
        if(f&&f._sig===rowSig(r)&&r.status!=='running')next.set(k,f);else{FULL.delete(k);next.set(k,stubOf(r))}}
      if(SEL&&!next.has(SEL)&&RUNS.has(SEL))next.set(SEL,RUNS.get(SEL));
      RUNS.clear();for(const [k,b] of next)RUNS.set(k,b);
      CMP_ROWS.clear();
      PROGRESS=await api('/api/progress'+(BENCH?'?'+new URLSearchParams({env:BENCH}):''));
      LOADED_KEY=key;
    }
    const cur=RUNS.get(SEL);if(cur&&(cur.stub||cur.manifest?.status==='running'))await loadFull(SEL,true);
    const sig=JSON.stringify([LOADED_KEY,[...RUNS.keys()].length,STATE.agents.map(a=>[a.id,a.connected,a.version,a.active]),STATE.jobs.map(j=>[j.id,j.state])]);
    const selRunning=RUNS.get(SEL)?.manifest?.status==='running';
    const typing=/SELECT|TEXTAREA/.test(document.activeElement?.tagName||'')||(document.activeElement?.tagName==='INPUT'&&document.activeElement.id!=='runq');
    if((sig!==LAST_SIG||selRunning)&&!typing){LAST_SIG=sig;render(selRunning)}
  }catch(e){console.warn(e)}
}
async function loadFull(k,force){
  const cur=RUNS.get(k);if(!LOCAL||!k||(!force&&cur&&!cur.stub))return cur;
  const [rid,att]=k.split('/');const b=await api(`/api/runs/${encodeURIComponent(rid)}/${encodeURIComponent(att)}`);
  if(cur?.row)b._sig=rowSig(cur.row);addBundle(b,'local');FULL.set(k,b);return b;
}
let EMBED_META=null;
function loadEmbedded(){
  try{const obj=JSON.parse($('#embedded-runs').textContent);EMBED_META={harness:obj.harness,links:obj.links};ingest(obj,'embedded')}catch(e){console.warn('embedded data unreadable',e)}
}

let dragN=0;
addEventListener('dragenter',e=>{e.preventDefault();dragN++;$('#drop').hidden=false});
addEventListener('dragleave',e=>{dragN=Math.max(0,dragN-1);if(!dragN)$('#drop').hidden=true});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',async e=>{e.preventDefault();dragN=0;$('#drop').hidden=true;await readFiles(e.dataTransfer.files)});
async function readFiles(files){
  for(const f of files){
    const text=await f.text();
    try{ingest(JSON.parse(text),'file:'+f.name)}catch(_){
      if(LOCAL){try{ingest(await api('/api/import-log?agent='+encodeURIComponent(f.name.replace(/\.[^.]+$/,'')),{method:'POST',body:text}),'file:'+f.name)}catch(err){alert('Could not import '+f.name+': '+err.message)}}
      else alert(f.name+' is not a run bundle. Convert an Omega log first:\nomegaeval import-log '+f.name);
    }
  }
  const newest=[...RUNS.keys()].pop();if(newest)SEL=newest;render(true);
}

/* ============================== derived timelines ============================== */
function derive(b){
  const env=b.env||[],obs={},act={},rec={},frames={},msgs=[],deliv={},concepts={};let term=null,start=null;
  for(const e of env){
    if(e.kind==='delivered')deliv[e.tick]=e;
    else if(e.kind==='agent_trace'&&e.trace?.kind==='concepts'){(concepts[e.trace.step??-1]??=[]).push(e)}
    else if(e.kind==='observation'){(obs[e.tick]??={})[e.to]=e}
    else if(e.kind==='action')act[e.tick]=e;
    else if(e.kind==='receipt')rec[e.tick]=e;
    else if(e.kind==='render')frames[e.tick]=e.frame;
    else if(e.kind==='agent_message')msgs.push(e);
    else if(e.kind==='terminal')term=e;
    else if(e.kind==='episode_start')start=e;
  }
  const ticks=Object.keys(obs).map(Number);const maxTick=ticks.length?Math.max(...ticks):-1;
  const members=b.manifest?.identity?.members||Object.keys(b.agents||{});
  const actor=b.manifest?.identity?.actor||members[0];
  const tag=b.manifest?.ep_tag;
  const per={};
  for(const m of members){
    const iters=(b.agents?.[m]?.iterations)||[];
    if(iters.length){
      let cur=null;
      const cols=iters.map(it=>{
        const tags=(it.ep_ticks||[]).filter(x=>!tag||x.ep===tag);
        const read=tags.length?tags[tags.length-1].t:null;if(read!=null)cur=read;
        const sends=(it.calls||[]).filter(c=>c.skill==='send');
        const claim=sends.map(c=>c.tick_claim).find(x=>x!=null);
        return {kind:'iter',it,tick:cur,read,act:claim??null,end:/ END\]/.test(it.human_msg||'')};
      });
      per[m]={mode:'omega',cols};
    }else{
      const cols=[];for(let t=0;t<=maxTick;t++)cols.push({kind:'tick',tick:t,read:t,act:act[t]&&act[t].agent===m?t:null});
      per[m]={mode:'env',cols};
    }
  }
  const preds={};for(const t in act)if(act[t].prediction!=null)preds[t]=act[t].prediction;
  return {obs,act,rec,frames,msgs,term,start,per,members,actor,maxTick,preds,deliv,concepts};
}

let LABELS={};
const runHash=rid=>{const s=String(rid||'');return s.slice(s.lastIndexOf('-')+1).slice(0,6)};
function label(b){const id=b.manifest?.identity||{};if(b.kind==='log-import')return `log import · ${id.subject}`;return `${LABELS[id.env]||id.env} · ${id.subject||'?'}${id.variant?' ['+id.variant+']':''} · ${id.task} · seed ${id.seed} · ${runHash(b.run_id)}#${b.attempt}`}
function renderLinks(){
  const L=(LOCAL?STATE?.links:EMBED_META?.links)||{};const ver=LOCAL?STATE?.version:EMBED_META?.harness;
  const items=[ver?`<span class="sub" data-tip="Version of the harness that ${LOCAL?'is serving this console':'exported these runs'}.">omegaeval ${esc(ver)}</span>`:'',
    L.documentation?`<a href="${esc(L.documentation)}" target="_blank" rel="noopener">Docs</a>`:'',
    L.repository?`<a href="${esc(L.repository)}" target="_blank" rel="noopener">Source</a>`:''];
  $('#links').innerHTML=items.filter(Boolean).join('');
}

  $('#benchsel').parentElement.dataset.tip='Scopes Play, Compare, Progress and Runs to one benchmark. The label and name come from omegaeval.toml: label = "HLE", name = "Humanity\'s Last Exam". '+(LOCAL?'Lists every installed benchmark, with or without runs.':'Lists the benchmarks with runs in this page.');
  const q=RUNQ.trim().toLowerCase();
  const all=[...RUNS.values()].filter(inBench).filter(b=>LOCAL||!q||(label(b)+' '+b.run_id).toLowerCase().includes(q)).sort((a,b)=>String(b.manifest?.started_at||b.row?.started_at||'').localeCompare(String(a.manifest?.started_at||a.row?.started_at||'')));
  const sel=$('#runsel');
  if(!SEL||!RUNS.has(SEL))SEL=all[0]?keyOf(all[0]):null;

  sel.disabled=!all.length;
  const shown=LOCAL?Math.min(RUN_TOTAL,PAGE):all.length;
  sel.parentElement.dataset.tip=LOCAL&&RUN_TOTAL>PAGE?`Showing the ${fmt(PAGE)} most recent of ${fmt(RUN_TOTAL)} runs. Narrow the list with Find.`:`${fmt(shown)} run${shown===1?'':'s'}${q?' matching "'+RUNQ+'"':''}.`;
  const cur=RUNS.get(SEL);const id=cur?.manifest?.identity||{};
  const mates=all.filter(b=>keyOf(b)!==SEL&&b.manifest?.identity?.env===id.env&&b.manifest?.identity?.task===id.task&&b.manifest?.identity?.seed===id.seed);
  const st=$('#stacksel');
  if(STACK&&!mates.some(b=>keyOf(b)===STACK))STACK='';
  st.innerHTML=`<option value="">none</option>`+mates.map(b=>`<option value="${esc(keyOf(b))}" ${keyOf(b)===STACK?'selected':''}>${esc(label(b))}</option>`).join('');
  st.disabled=!mates.length;
  st.parentElement.dataset.tip=mates.length?'Show another run of the same benchmark, task and seed underneath this one, step by step: for example this agent against last week\'s version, or against the oracle. It never mixes benchmarks.':'No other run of this benchmark, task and seed is loaded.';
  $('#nruns').textContent=LOCAL?(RUN_TOTAL?fmt(RUN_TOTAL):''):(RUNS.size||'');

  const rowsHtml=METRICS.map(mt=>{

function ablationTable(variants){

/* Solve counts per set of runs and per agent version: from the harness in local mode, from the
   loaded runs otherwise. Same shape either way. */
function aggregateSets(rows){
  const sets=new Map();
  for(const r of rows){const id=r.identity||{};const k=[id.env,id.task,id.subject,id.variant||''].join('|');
    if(!sets.has(k))sets.set(k,{env:id.env,task:id.task,subject:id.subject,variant:id.variant||'',n:0,graded:0,solved:0,_steps:[],first:r.started_at,_v:new Map()});
    const s=sets.get(k);const ver=Object.values(r.agent_versions||{}).find(Boolean)||'version not reported';
    if(!s._v.has(ver))s._v.set(ver,{version:ver,n:0,graded:0,solved:0,_steps:[],first:r.started_at});
    for(const t of [s,s._v.get(ver)]){t.n++;const ok=r.result?.outcome?.success;if(ok!=null){t.graded++;if(ok)t.solved++}
      const st=r.result?.efficiency?.steps;if(st!=null)t._steps.push(st);if(String(r.started_at||'')<String(t.first||'~'))t.first=r.started_at}}
  return [...sets.values()].map(s=>({...s,median_steps:median(s._steps),versions:[...s._v.values()].map(v=>({...v,median_steps:median(v._steps)}))}));
}
function progressSets(){return LOCAL?PROGRESS:aggregateSets(resultsFromBundles().filter(r=>!BENCH||r.identity?.env===BENCH))}
function renderProgress(){
  const v=$('#view-progress');const sets=progressSets().filter(s=>!BENCH||s.env===BENCH);
  if(!sets.length){v.innerHTML=`<div class="vh"><h1>Progress</h1></div><div class="empty">${emptyState()}</div>`;return}
  const games=new Map();for(const s of sets){const k=s.env+'/'+s.task;if(!games.has(k))games.set(k,[]);games.get(k).push(s)}
  let html=`<div class="vh"><h1>Progress</h1><span class="sub">For each benchmark: solve rate of every set of runs, between the random floor and the oracle ceiling where those have been run.</span></div>`;
  for(const [g,list] of games){
    const rate=s=>s.graded?s.solved/s.graded:null;
    const floor=list.find(s=>s.subject==='baseline-random'),ceil=list.find(s=>s.subject==='baseline-oracle');
    const others=list.filter(s=>!s.subject.startsWith('baseline-'));
    const L=60,R=700,Wd=760,y=52,pos=x=>L+x*(R-L);
    let s=`<line class="track" x1="${L}" y1="${y}" x2="${R}" y2="${y}"/>`;
    [0,.25,.5,.75,1].forEach(t=>{s+=`<line class="gl" x1="${pos(t)}" y1="${y-10}" x2="${pos(t)}" y2="${y+10}"/><text class="bv" x="${pos(t)}" y="${y+46}" text-anchor="middle">${Math.round(t*100)}%</text>`});
    const mark=(st,shape,color,lab,dy)=>{const r=rate(st);if(r==null)return;const x=pos(r);const med=st.median_steps;
      s+=shape==='sq'?`<rect x="${x-5}" y="${y-5}" width="10" height="10" fill="var(--surface)" stroke="var(--ink-2)" stroke-width="1.5" data-tip="${esc(lab+': solved '+Math.round(r*100)+'% of '+st.graded+', median '+fmt(med)+' steps')}"/>`:shape==='di'?`<path d="M${x},${y-7} l7,7 l-7,7 l-7,-7z" fill="var(--good)" data-tip="${esc(lab+': solved '+Math.round(r*100)+'% of '+st.graded+', median '+fmt(med)+' steps')}"/>`:`<circle cx="${x}" cy="${y}" r="6" fill="${color}" stroke="var(--surface)" stroke-width="1.5" data-tip="${esc(lab+': solved '+Math.round(r*100)+'% of '+st.graded+', median '+fmt(med)+' steps')}"/>`;
      s+=`<text class="bl" x="${x}" y="${y+dy}" text-anchor="middle">${esc(lab)}</text>`};
    if(floor)mark(floor,'sq',null,'random floor',24);if(ceil)mark(ceil,'di',null,'oracle',24);
    others.forEach((o,i)=>mark(o,'c','var(--accent)',o.subject+(o.variant?' ['+o.variant+']':''),-14-(i%3)*13));
    const missing=[!floor&&'random floor',!ceil&&'oracle ceiling'].filter(Boolean);
    html+=`<div class="card"><h2>${esc((LABELS[g.split('/')[0]]||g.split('/')[0])+' / '+g.split('/')[1])}</h2><div class="sub">Solve rate across seeds. ${missing.length?`<span class="na">Not run yet: ${missing.join(', ')}. Run <span class="code">omegaeval baseline ${!floor?'random':'oracle'} ${esc(g.split('/')[0])} --task ${esc(g.split('/')[1])} --seeds 1-5</span>.</span>`:''} <span class="na why" data-tip="${esc(F.specialist.absent)}">No trained specialist.</span></div><div class="scroll"><svg class="band" viewBox="-10 0 ${Wd+20} 104" role="img" aria-label="Solve rates for ${esc(g)}">${s}</svg></div></div>`;
  }

  html+=`<div class="card"><h2>Ledger by agent version</h2><div class="sub">Grouped by the version string each agent announced when it connected. Newest first.</div>${vers.length?`<div class="scroll"><table class="t"><thead><tr><th>Agent</th><th>Benchmark</th><th>Version</th><th>First run</th><th>Episodes</th><th>Solved</th><th>Median steps</th></tr></thead><tbody>${vers.map(e=>`<tr><td>${esc(e.subject)}${e.variant?' ['+esc(e.variant)+']':''}</td><td>${esc((LABELS[e.env]||e.env)+' / '+e.task)}</td><td class="v">${esc(e.ver)}</td><td class="v">${esc(String(e.first||'').slice(0,16).replace('T',' '))}</td><td class="v">${fmt(e.n)}</td><td class="v">${fmt(e.solved)} / ${fmt(e.graded)}</td><td class="v">${fmt(e.median_steps)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty na">No OmegaClaw runs yet. Baseline runs are shown on the bands above.</div>`}</div>`;
  v.innerHTML=html;
}

function srcLinks(html){
  return html.replace(/\b((?:src|channels|providers|config)\/[\w.-]+\.(?:metta|py|conf)|scripts\/omega|docs\/reference-[\w.-]+\.md)/g,m=>`<a href="${OMEGA_AT}${m}" target="_blank" rel="noopener">${m}</a>`)
    .replace(/\bsingnet\/Omega#(\d+)/g,(m,n)=>`<a href="https://github.com/singnet/Omega/pull/${n}" target="_blank" rel="noopener">${m}</a>`)
    .replace(/\bpetta_lib_chromadb\b/g,'<a href="https://github.com/patham9/petta_lib_chromadb" target="_blank" rel="noopener">petta_lib_chromadb</a>')
    .replace(/\(github\.com\/singnet\/Omega\)/g,'(<a href="https://github.com/singnet/Omega/tree/ee0618a" target="_blank" rel="noopener">github.com/singnet/Omega</a>)');
}
function renderSources(){
  const v=$('#view-sources');const b=RUNS.get(SEL);const bb=b&&!b.stub?b:null;
  const groups=[...new Set(FIELDS.map(f=>f.group))];
  v.innerHTML=`<div class="vh"><h1>Sources</h1><span class="sub">Where every field in this console comes from, and whether the selected run carries it${bb?': '+esc(label(bb)):''}.</span></div>
  ${groups.map(g=>`<div class="card scroll"><h2>${esc(g)}</h2><table class="t"><thead><tr><th>Field</th><th>Source</th><th>This run</th></tr></thead><tbody>${FIELDS.filter(f=>f.group===g).map(f=>{const s=status(f.id,bb);
    return `<tr class="${s.ok?'':'off'}"><td>${esc(f.label)}</td><td>${srcLinks(esc(f.source||'—'))}</td><td>${f.absent||s.absent?'<span class="pill na">not in OmegaClaw</span>':s.ok?`<span class="pill ok"><i></i>${s.derived?'derived':'present'}</span>`:`<span class="pill na why" data-tip="${esc(s.reason)}">not in this run</span>`}${!s.ok?`<div class="sub" style="margin-top:4px">${esc(s.reason)}</div>`:''}</td></tr>`}).join('')}</tbody></table></div>`).join('')}
  <div class="card"><h2>Validated against</h2><div class="sub">${srcLinks('OmegaClaw (github.com/singnet/Omega) at commit ee0618a, 25 September 2026. The open pull request singnet/Omega#358 moves the LLM to the tools API and will change the response log lines. Re-run the parser tests when it lands.')}${(LOCAL?STATE?.links:EMBED_META?.links)?.repository?` Field by field: <a href="${esc((LOCAL?STATE?.links:EMBED_META?.links).repository.replace(/\/$/,'')+'/blob/main/docs/OMEGACLAW.md')}" target="_blank" rel="noopener">docs/OMEGACLAW.md</a>.`:''}</div></div>`;
}

/* ============================== boot ============================== */
function render(full){renderHeader();if(VIEW==='play')renderPlay();else if(VIEW==='compare')renderCompare();else if(VIEW==='progress')renderProgress();else if(VIEW==='runs')renderRuns();else if(VIEW==='sources')renderSources();if(full&&VIEW==='play')refreshSelection()}
(async()=>{loadEmbedded();await detectLocal();if(!document.querySelector('.rail button[data-view="'+VIEW+'"]'))VIEW='play';show(VIEW);if(SEL)await loadFull(SEL);render(true)})();
</script>
